name: Build iNextOS for KICKPI K1A

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build iNextOS image (KICKPI K1A / RK3568)
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout board adaptation
        uses: actions/checkout@v4
        with:
          path: k1a

      - name: Checkout iNextOS build framework (armbian-easepi)
        uses: actions/checkout@v4
        with:
          repository: jjm2473/armbian-easepi
          ref: easepi-v26.02
          path: build

      - name: Inject KICKPI K1A board support
        run: |
          set -e
          cp -v k1a/config/boards/kickpi-k1a.csc build/config/boards/
          mkdir -p build/patch/kernel/rk35xx-vendor-6.1/dt
          cp -v k1a/patch/kernel/rk35xx-vendor-6.1/dt/rk3568-kickpi-k1a.dts \
                build/patch/kernel/rk35xx-vendor-6.1/dt/
          # 注入 maxio PHY 驱动 patch（K1A 网口用的是 Maxio MAE0621A）
          # 框架内已有 001~004，armbian 按文件名顺序自动应用；漏这一步内核就没有 maxio 驱动
          cp -v k1a/patch/kernel/rk35xx-vendor-6.1/005-maxio-phy.patch \
                build/patch/kernel/rk35xx-vendor-6.1/
          echo "--- board config:"; cat build/config/boards/kickpi-k1a.csc
          echo "--- dts head:"; head -20 build/patch/kernel/rk35xx-vendor-6.1/dt/rk3568-kickpi-k1a.dts
          # 启用 Maxio MAE0621A PHY 驱动（K1A 两个网口都使用它）
          for f in build/config/kernel/*rk35xx*.config; do
            [ -f "$f" ] && echo 'CONFIG_MAXIO_PHY=y' >> "$f" && echo "CONFIG_MAXIO_PHY=y -> $f"
          done || true
          ls build/config/kernel/ 2>/dev/null | head -20 || true

      - name: Set up QEMU (binfmt_misc for arm64 cross-build)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm


      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: Build iNextOS image
        run: |
          cd build
          ./compile.sh build \
            BOARD=kickpi-k1a \
            BRANCH=vendor \
            RELEASE=trixie \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            CLEAN_LEVEL="" \
            SHOW_LOG=yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix DTB and armbianEnv in image
        run: |
          set -e
          IMG=$(ls build/output/images/*.img | head -n1)
          [ -n "$IMG" ] || { echo "!! 输出镜像未找到"; exit 1; }
          echo "target image: $IMG"; ls -lh "$IMG"
          LOOP=$(sudo losetup -f --show -P "$IMG")
          echo "loop: $LOOP"
          sudo mkdir -p /mnt/ib
          sudo mount ${LOOP}p1 /mnt/ib
          # 1) 用已在 K1A 上验证过的 DTB 覆盖
          #    它包含：K1A 原生硬件描述 + VOP OPP/供电 + 去掉 sd-uhs-sdr104 + 清空 chosen.bootargs
          sudo cp -fv k1a/kernel-files/rk3568-kickpi-k1a.dtb /mnt/ib/dtb/rockchip/
          # 2) 补全 armbianEnv.txt（缺 fdtfile/rootdev 会导致无 DTB、root 挂错 -> 黑屏/起不来）
          ROOT_UUID=$(sudo blkid -s UUID -o value ${LOOP}p2)
          echo "rootfs UUID: $ROOT_UUID"
          sudo tee /mnt/ib/armbianEnv.txt >/dev/null <<EOF
          verbosity=1
          bootlogo=false
          console=both
          extraargs=cma=256M video=HDMI-A-1:1920x1080@60e
          overlay_prefix=rk35xx
          fdtfile=rockchip/rk3568-kickpi-k1a.dtb
          rootdev=UUID=${ROOT_UUID}
          rootfstype=ext4
          usbstoragequirks=0x2537:0x1066:u,0x2537:0x1068:u
          EOF
          echo "--- final armbianEnv.txt ---"; cat /mnt/ib/armbianEnv.txt
          echo "--- final DTB ---"; md5sum /mnt/ib/dtb/rockchip/rk3568-kickpi-k1a.dtb; ls -l /mnt/ib/dtb/rockchip/rk3568-kickpi-k1a.dtb
          sync
          sudo umount /mnt/ib
          sudo losetup -d "$LOOP"
          if [ -f "${IMG}.xz" ]; then echo "re-compressing..."; rm -f "${IMG}.xz"; xz -T0 "${IMG}"; ls -lh "${IMG}.xz"; fi

      - name: Show outputs
        if: always()
        run: |
          echo "=== output tree ==="
          find build/output -maxdepth 3 -type f 2>/dev/null | head -50 || true

      - name: Upload iNextOS artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inextos-kickpi-k1a
          path: |
            build/output/images/*.img
            build/output/images/*.img.xz
            build/output/images/*.sha
            build/output/debs/*.deb
          if-no-files-found: warn
          retention-days: 14
