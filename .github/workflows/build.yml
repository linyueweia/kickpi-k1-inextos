name: Build iNextOS for KICKPI K1A

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build iNextOS image (KICKPI K1A / RK3568)
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout board adaptation
        uses: actions/checkout@v4
        with:
          path: k1a

      - name: Checkout iNextOS build framework (armbian-easepi)
        uses: actions/checkout@v4
        with:
          repository: jjm2473/armbian-easepi
          ref: easepi-v26.02
          path: build

      - name: Inject KICKPI K1A board support
        run: |
          set -e
          cp -v k1a/config/boards/kickpi-k1a.csc build/config/boards/
          mkdir -p build/patch/kernel/rk35xx-vendor-6.1/dt
          cp -v k1a/patch/kernel/rk35xx-vendor-6.1/dt/rk3568-kickpi-k1a.dts \
                build/patch/kernel/rk35xx-vendor-6.1/dt/
          # 注入 maxio PHY 驱动 patch（K1A 网口用的是 Maxio MAE0621A）
          # 框架内已有 001~004，armbian 按文件名顺序自动应用；漏这一步内核就没有 maxio 驱动
          cp -v k1a/patch/kernel/rk35xx-vendor-6.1/005-maxio-phy.patch \
                build/patch/kernel/rk35xx-vendor-6.1/
          echo "--- board config:"; cat build/config/boards/kickpi-k1a.csc
          echo "--- dts head:"; head -20 build/patch/kernel/rk35xx-vendor-6.1/dt/rk3568-kickpi-k1a.dts
          # 启用 Maxio MAE0621A PHY 驱动（K1A 两个网口都使用它）
          for f in build/config/kernel/*rk35xx*.config; do
            [ -f "$f" ] && echo 'CONFIG_MAXIO_PHY=y' >> "$f" && echo "CONFIG_MAXIO_PHY=y -> $f"
          done || true
          ls build/config/kernel/ 2>/dev/null | head -20 || true

      - name: Set up QEMU (binfmt_misc for arm64 cross-build)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm


      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - name: Build iNextOS image
        run: |
          cd build
          ./compile.sh build \
            BOARD=kickpi-k1a \
            BRANCH=vendor \
            RELEASE=trixie \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            CLEAN_LEVEL="" \
            SHOW_LOG=yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch K1A bootloader into image
        run: |
          set -e
          IMG=$(ls build/output/images/*.img | head -n1)
          [ -n "$IMG" ] || { echo "!! 输出镜像未找到"; exit 1; }
          echo "target image: $IMG"
          ls -lh "$IMG"
          # ★ 关键：K1A 的 DDR 初始化固件就装在 idbloader.img 里，
          #   框架默认 BOOTCONFIG=radxa-e25-rk3568_defconfig（LPDDR4），
          #   在 K1A（DDR4）上 SPL 阶段内存初始化就失败 -> 连 U-Boot 都进不去 -> HDMI 全黑。
          #   这里用从 K1A 实机 eMMC 提取、已验证可启动的 bootloader 覆盖。
          dd if=k1a/kernel-files/idbloader.img of="$IMG" bs=512 seek=64    conv=notrunc,fsync
          dd if=k1a/kernel-files/u-boot.itb   of="$IMG" bs=512 seek=16384 conv=notrunc,fsync
          sync
          echo "--- 镜像内引导区校验（应与 kernel-files 一致）---"
          echo -n "img  @32KiB  : "; dd if="$IMG" bs=512 skip=64    count=620  status=none | md5sum
          echo -n "img  @8MiB   : "; dd if="$IMG" bs=512 skip=16384 count=3251 status=none | md5sum
          echo -n "src  idb     : "; md5sum k1a/kernel-files/idbloader.img
          echo -n "src  uboot   : "; md5sum k1a/kernel-files/u-boot.itb
          # 引导区已变，重新生成 .xz
          if [ -f "${IMG}.xz" ]; then
            echo "re-compressing ${IMG}.xz ..."
            rm -f "${IMG}.xz"
            xz -T0 "${IMG}"
            ls -lh "${IMG}.xz"
          fi

      - name: Show outputs
        if: always()
        run: |
          echo "=== output tree ==="
          find build/output -maxdepth 3 -type f 2>/dev/null | head -50 || true

      - name: Upload iNextOS artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inextos-kickpi-k1a
          path: |
            build/output/images/*.img
            build/output/images/*.img.xz
            build/output/images/*.sha
            build/output/debs/*.deb
          if-no-files-found: warn
          retention-days: 14
