name: Build maxio.ko (Maxio MAE0621A) for K1A / FnNAS  [unifreq source]

# 结论（已查清）：
#  - ophub 的 header 包里的 host tools(fixdep/modpost) 是 aarch64 二进制，
#    在 x86_64 runner 上无法执行("Exec format error")，且它们无法脱离内核树单独编译。
#  - 正确做法：用官方内核源码 unifreq/linux-6.18.y，从飞牛 kernel 包取 config，
#    make modules_prepare 生成 x86 host tools，再编 maxio.ko。
#  - ★ 编译必须用 out-of-tree 独立目录 + `modules` 目标。
#    `make M=drivers/net/phy maxio.ko` 走 single_modules，不传 -DMODULE，
#    MODULE_LICENSE 宏会展开为空 → modpost 报 "missing MODULE_LICENSE()"。
#    （驱动本体第 411 行本来就有 MODULE_LICENSE("GPL")，不是驱动的问题。）

on:
  workflow_dispatch:
    inputs:
      kernel_ver:
        description: 'FnNAS kernel version (e.g. 6.18.18)'
        required: true
        default: '6.18.18'
      ksrc_branch:
        description: 'unifreq kernel branch'
        required: true
        default: 'main'

jobs:
  build-ko:
    name: maxio.ko (${{ github.event.inputs.kernel_ver }}) from unifreq source
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and kernel build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make bc flex bison libssl-dev libelf-dev \
                                  kmod device-tree-compiler cpio rsync

      - name: Fetch FnNAS kernel config (from ophub kernel bundle)
        run: |
          set -e
          KV="${{ github.event.inputs.kernel_ver }}"
          URL="https://github.com/ophub/fnnas/releases/download/kernel_fnnas/${KV}-rockchip.tar.gz"
          curl -fL --retry 3 -o /tmp/kb.tar.gz "$URL"
          mkdir -p /tmp/kb && tar xzf /tmp/kb.tar.gz -C /tmp/kb
          tar xzf "$(find /tmp/kb -name 'boot-*.tar.gz' | head -1)" -C /tmp/kb
          CFG="$(find /tmp/kb -maxdepth 2 -name 'config-*' | head -1)"
          echo "config: $CFG"
          mkdir -p /tmp/cfg && cp "$CFG" /tmp/cfg/config
          head -5 /tmp/cfg/config
          # header 包里有与内核完全匹配的 Module.symvers（modpost 必需）
          mkdir -p /tmp/kh && tar xzf "$(find /tmp/kb -name 'header-*.tar.gz' | head -1)" -C /tmp/kh
          SYMV="$(find /tmp/kh -maxdepth 2 -name 'Module.symvers' | head -1)"
          echo "Module.symvers: $SYMV"
          cp "$SYMV" /tmp/cfg/Module.symvers
          wc -l /tmp/cfg/Module.symvers

      - name: Clone unifreq kernel source (target tag; vermagic must match)
        run: |
          set -e
          KV="${{ github.event.inputs.kernel_ver }}"
          # ★ 必须 clone 目标内核的 tag，而不是分支 tip：
          #   分支 main 现在已是 6.18.53+，编出的 .ko vermagic 与飞牛 6.18.18 内核不匹配。
          git clone --depth=1 --branch "v${KV}" \
            https://github.com/unifreq/linux-6.18.y /tmp/ks
          cd /tmp/ks
          echo "--- Makefile VERSION/PATCHLEVEL/SUBLEVEL ---"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) ' Makefile
          echo "--- source size:"; du -sh /tmp/ks

      - name: Configure kernel (olddefconfig) and prepare build
        run: |
          set -e
          cd /tmp/ks
          cp /tmp/cfg/config .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig 2>&1 | tail -10
          echo "--- prepare host tools + module headers ---"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- HOSTCC=/usr/bin/gcc \
               modules_prepare -j4 2>&1 | tail -15
          # 放入匹配的 Module.symvers（否则 modpost 报所有内核符号 undefined）
          cp /tmp/cfg/Module.symvers /tmp/ks/Module.symvers
          echo "symvers lines: $(wc -l < /tmp/ks/Module.symvers)"
          echo "--- host tool arch (must be x86-64) ---"
          file -b /tmp/ks/scripts/basic/fixdep
          file -b /tmp/ks/scripts/mod/modpost

      - name: Prepare maxio module (out-of-tree dir)
        run: |
          set -e
          mkdir -p /tmp/mx
          cp "$GITHUB_WORKSPACE/kernel-files/maxio.c" /tmp/mx/maxio.c
          # 6.18 兼容：phy_device.eee_broken_modes 已移除（EEE 已由 MDIO_AN_EEE_ADV=0 关闭）
          sed -i 's|^\([[:space:]]*\)phydev->eee_broken_modes = broken;|\1/* removed: member gone in >=6.14 */|' /tmp/mx/maxio.c
          printf 'obj-m += maxio.o\n' > /tmp/mx/Makefile
          echo "--- /tmp/mx:"; ls -l /tmp/mx
          echo "--- license/desc 行（必须存在）:"
          grep -n 'MODULE_LICENSE\|MODULE_DESCRIPTION\|module_phy_driver' /tmp/mx/maxio.c

      - name: Build maxio.ko (out-of-tree, modules target)
        run: |
          set -e -o pipefail
          cd /tmp/ks
          # ★ 必须用 modules 目标（会传 -DMODULE）。
          #   切勿用 `M=/tmp/mx maxio.ko`：那是 single_modules，不传 -DMODULE，
          #   MODULE_LICENSE 宏展开为空 → modpost 报 missing MODULE_LICENSE()。
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- HOSTCC=/usr/bin/gcc \
               CC=aarch64-linux-gnu-gcc M=/tmp/mx modules 2>&1 | tail -80
          echo "=== artifact ==="
          ls -l /tmp/mx/maxio.ko
          aarch64-linux-gnu-objdump -f /tmp/mx/maxio.ko | head -4
          modinfo /tmp/mx/maxio.ko | head -12

      - name: Upload maxio.ko
        uses: actions/upload-artifact@v4
        with:
          name: maxio-ko-${{ github.event.inputs.kernel_ver }}
          path: /tmp/mx/maxio.ko
          if-no-files-found: error
