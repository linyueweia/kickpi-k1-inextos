name: Build maxio.ko (Maxio MAE0621A) for K1A / FnNAS  [unifreq source]

# 结论（已查清）：
#  - ophub 的 header 包里的 host tools(fixdep/modpost) 是 aarch64 二进制，
#    在 x86_64 runner 上无法执行("Exec format error")，且它们无法脱离内核树单独编译。
#  - 正确做法：用官方内核源码 unifreq/linux-6.18.y，从飞牛 kernel 包取 config，
#    make modules_prepare 生成 x86 host tools，再编 maxio.ko。

on:
  workflow_dispatch:
    inputs:
      kernel_ver:
        description: 'FnNAS kernel version (e.g. 6.18.18)'
        required: true
        default: '6.18.18'
      ksrc_branch:
        description: 'unifreq kernel branch'
        required: true
        default: 'main'

jobs:
  build-ko:
    name: maxio.ko (${{ github.event.inputs.kernel_ver }}) from unifreq source
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and kernel build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make bc flex bison libssl-dev libelf-dev \
                                  kmod device-tree-compiler cpio rsync

      - name: Fetch FnNAS kernel config (from ophub kernel bundle)
        run: |
          set -e
          KV="${{ github.event.inputs.kernel_ver }}"
          URL="https://github.com/ophub/fnnas/releases/download/kernel_fnnas/${KV}-rockchip.tar.gz"
          curl -fL --retry 3 -o /tmp/kb.tar.gz "$URL"
          mkdir -p /tmp/kb && tar xzf /tmp/kb.tar.gz -C /tmp/kb
          tar xzf "$(find /tmp/kb -name 'boot-*.tar.gz' | head -1)" -C /tmp/kb
          CFG="$(find /tmp/kb -maxdepth 2 -name 'config-*' | head -1)"
          echo "config: $CFG"
          mkdir -p /tmp/cfg && cp "$CFG" /tmp/cfg/config
          head -5 /tmp/cfg/config

      - name: Clone unifreq kernel source
        run: |
          set -e
          git clone --depth=1 -b "${{ github.event.inputs.ksrc_branch }}" \
            https://github.com/unifreq/linux-6.18.y /tmp/ks
          echo "--- kernel Makefile head:"; head -5 /tmp/ks/Makefile
          echo "--- source size:"; du -sh /tmp/ks

      - name: Configure kernel (olddefconfig) and prepare build
        run: |
          set -e
          cd /tmp/ks
          cp /tmp/cfg/config .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig 2>&1 | tail -10
          echo "--- prepare host tools + module headers ---"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- HOSTCC=/usr/bin/gcc \
               modules_prepare -j4 2>&1 | tail -15
          echo "--- host tool arch (must be x86-64) ---"
          file -b /tmp/ks/scripts/basic/fixdep
          file -b /tmp/ks/scripts/mod/modpost

      - name: Inject maxio driver (source + Kconfig + Makefile)
        run: |
          set -e
          cd /tmp/ks
          cp "$GITHUB_WORKSPACE/kernel-files/maxio.c" drivers/net/phy/maxio.c
          # 6.18 兼容：phy_device.eee_broken_modes 已移除（EEE 已由 MDIO_AN_EEE_ADV=0 关闭）
          sed -i 's|^\([[:space:]]*\)phydev->eee_broken_modes = broken;|\1/* removed: member gone in >=6.14 */|' drivers/net/phy/maxio.c
          # Kconfig
          if ! grep -q 'config MAXIO_PHY' drivers/net/phy/Kconfig; then
            python3 - <<'PYEOF'
p='drivers/net/phy/Kconfig'
s=open(p).read()
blk='config MAXIO_PHY\n\ttristate "Maxio PHYs"\n\thelp\n\t  Currently supports the Maxio MAE0621A family of Gigabit Ethernet PHYs.\n\n'
open(p,'w').write(s.replace('config MOTORCOMM_PHY', blk+'config MOTORCOMM_PHY', 1))
PYEOF
          fi
          # Makefile
          if ! grep -q 'CONFIG_MAXIO_PHY' drivers/net/phy/Makefile; then
            sed -i 's|^obj-$(CONFIG_MOTORCOMM_PHY)|obj-$(CONFIG_MAXIO_PHY)\t\t+= maxio.o\nobj-$(CONFIG_MOTORCOMM_PHY)|' drivers/net/phy/Makefile
          fi
          echo "--- Kconfig:"; grep -A3 'config MAXIO_PHY' drivers/net/phy/Kconfig
          echo "--- Makefile:"; grep -n 'MAXIO_PHY' drivers/net/phy/Makefile

      - name: Build maxio.ko
        run: |
          set -e
          cd /tmp/ks
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- HOSTCC=/usr/bin/gcc \
               CC=aarch64-linux-gnu-gcc M=drivers/net/phy maxio.ko -j4 2>&1 | tail -30
          echo "=== artifact ==="
          ls -l drivers/net/phy/maxio.ko
          aarch64-linux-gnu-objdump -f drivers/net/phy/maxio.ko | head -4
          modinfo drivers/net/phy/maxio.ko | head -12

      - name: Upload maxio.ko
        uses: actions/upload-artifact@v4
        with:
          name: maxio-ko-${{ github.event.inputs.kernel_ver }}
          path: /tmp/ks/drivers/net/phy/maxio.ko
          if-no-files-found: error
